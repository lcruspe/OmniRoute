name: Render Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render service
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send keepalive request
        run: |
          curl --silent --show-error --fail \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://omniroute-n0oe.onrender.com
